<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Fundamentals Practice Lab</title>
  <style>
    /* =========================================================
       LAB 1: Global Reset & The Box Model
       ========================================================= */
    /* TODO 1a: Add the universal border-box reset here (*, *::before, *::after) */

    body {
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      padding: 2rem;
      background-color: #f8fafc;
      color: #1e293b;
    }

    /* Target this card to test content-box vs border-box */
    .box-model-card {
      width: 300px;
      padding: 24px;
      border: 4px solid #0284c7;
      margin-bottom: 2rem;
      background-color: #e0f2fe;
      /* Inspect this element in DevTools to see how the width changes */
    }

    /* =========================================================
       LAB 2: Margin Collapse
       ========================================================= */
    .collapse-container {
      background-color: #f1f5f9;
      border: 1px dashed #94a3b8;
      padding: 0; /* Notice: with no padding/border on children, margins touch */
    }

    .top-box {
      background-color: #fecdd3;
      padding: 1rem;
      margin-bottom: 40px;
    }

    .bottom-box {
      background-color: #bbf7d0;
      padding: 1rem;
      margin-top: 25px;
    }

    /* =========================================================
       LAB 3: Specificity & The Cascade
       ========================================================= */
    /* Notice the order and selector types below. Which rule wins the color? */
    #primary-nav .nav-link {
      color: #dc2626; /* Red */
    }

    header nav#primary-nav li a {
      color: #2563eb; /* Blue */
    }

    nav ul.menu li a:hover {
      text-decoration: underline;
    }

    .menu {
      list-style: none;
      display: flex;
      gap: 1rem;
      padding: 0;
      margin: 2rem 0;
    }

    /* =========================================================
       LAB 4 & 5: Mobile First & Range Syntax Media Queries
       ========================================================= */
    /* Base styles: Mobile first (single column) */
    .responsive-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-top: 2rem;
    }

    .grid-item {
      background: white;
      padding: 1.5rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    /* TODO 4a: Rewrite using modern range syntax (width >= 640px) */
    @media (min-width: 640px) {
      .responsive-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* TODO 4b: Rewrite using modern range syntax (768px <= width <= 1024px) */
    @media (min-width: 768px) and (max-width: 1024px) {
      .grid-item {
        border-color: #6366f1;
      }
    }

    /* TODO 4c: Add a rule for large screens (width >= 1024px) for 3 columns */
  </style>
</head>
<body>

  <!-- 1. The Box Model -->
  <section>
    <h2>1. Box Model Lab</h2>
    <div class="box-model-card">
      Inspect me in browser DevTools! Check my computed total width.
    </div>
  </section>

  <!-- 2. Margin Collapse -->
  <section>
    <h2>2. Margin Collapse Lab</h2>
    <div class="collapse-container">
      <div class="top-box">margin-bottom: 40px</div>
      <div class="bottom-box">margin-top: 25px</div>
    </div>
  </section>

  <!-- 3. Specificity -->
  <section>
    <h2>3. Specificity Lab</h2>
    <header>
      <nav id="primary-nav">
        <ul class="menu">
          <li><a href="#" class="nav-link">Home</a></li>
          <li><a href="#" class="nav-link">About</a></li>
        </ul>
      </nav>
    </header>
  </section>

  <!-- 4 & 5. Responsive Grid -->
  <section>
    <h2>4 & 5. Mobile-First Responsive Grid</h2>
    <div class="responsive-grid">
      <div class="grid-item">Card 1</div>
      <div class="grid-item">Card 2</div>
      <div class="grid-item">Card 3</div>
    </div>
  </section>

</body>
</html>
